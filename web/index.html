<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101312"><title>Axiom — Competitive Study Workspace</title>
<style>
:root{color-scheme:dark;--bg:#101312;--panel:#171b19;--panel2:#1e2421;--line:#2b342f;--text:#f1f5f2;--muted:#a0aaa4;--green:#a7f3c0;--green2:#254d36;--yellow:#f4d76a;--red:#ff8585;--purple:#c8a5ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:10px;background:var(--panel2);color:var(--text);padding:10px 14px}button:hover{border-color:#617268}button.primary{background:var(--green);color:#102016;border-color:var(--green);font-weight:750}button:disabled{opacity:.4;cursor:not-allowed}.shell{display:grid;grid-template-columns:244px 1fr;min-height:100vh}.side{border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:20px;background:#121614}.brand{display:flex;align-items:center;gap:10px;padding:0 10px;font-size:20px;font-weight:850;letter-spacing:-.7px}.logo{width:34px;height:34px;border-radius:11px;background:var(--green);color:#132019;display:grid;place-items:center;font-weight:900}.nav{display:grid;gap:6px}.nav button{text-align:left;background:transparent;border-color:transparent;color:var(--muted)}.nav button.active{background:var(--panel2);border-color:var(--line);color:var(--text)}.nav button span{display:inline-block;width:25px;color:var(--green)}.sidebottom{margin-top:auto;display:grid;gap:8px}.profile{border-top:1px solid var(--line);padding:14px 8px 0;color:var(--muted);font-size:12px;overflow-wrap:anywhere}.main{min-width:0}.top{height:68px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;gap:12px}.course-select{background:transparent;border:1px solid var(--line);border-radius:9px;padding:8px 10px;color:var(--text)}.content{max-width:1180px;padding:30px;margin:auto}.eyebrow{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;color:var(--green);font-weight:800}.heading{font-size:clamp(28px,4vw,38px);line-height:1.12;letter-spacing:-1.2px;margin:8px 0 10px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.stats{grid-template-columns:repeat(4,minmax(0,1fr));margin:24px 0}.card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:18px;min-width:0}.statnum{font-size:26px;font-weight:800;margin:4px 0}.sectionhead{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:28px 0 14px}.sectionhead h2{font-size:18px;margin:0}.unit{margin:18px 0 26px}.unithead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px}.lessons{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}.lesson{display:flex;flex-direction:column;align-items:center;gap:7px;background:var(--panel);padding:15px 6px;border-radius:14px;border:1px solid var(--line);min-height:105px}.lesson .circle{width:44px;height:44px;border:3px solid var(--muted);border-radius:50%;display:grid;place-items:center;font-weight:800}.lesson.easy .circle{border-color:#67d69a}.lesson.medium .circle{border-color:var(--yellow)}.lesson.hard .circle{border-color:var(--red)}.lesson.expert .circle{border-color:var(--purple)}.lesson small{color:var(--muted);font-size:11px}.tag{border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800;display:inline-flex;align-items:center;gap:5px;background:var(--panel2);color:var(--muted)}.tag.easy{color:#67d69a}.tag.medium{color:var(--yellow)}.tag.hard{color:var(--red)}.tag.expert{color:var(--purple)}.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.spread{display:flex;justify-content:space-between;align-items:center;gap:12px}.hidden{display:none!important}.field{display:grid;gap:6px;margin:12px 0}.field input,.field textarea,.field select{width:100%;background:#101412;color:var(--text);border:1px solid var(--line);border-radius:9px;padding:11px}.question{font-size:22px;font-weight:700;line-height:1.35;margin:22px 0}.answers{display:grid;gap:10px}.answer{text-align:left;padding:14px;border-radius:12px}.answer.chosen{border-color:var(--green);background:#20352a}.feedback{padding:12px;border-radius:10px;margin:12px 0;background:var(--panel2)}.progress{height:6px;background:var(--line);border-radius:9px;overflow:hidden}.progress div{height:100%;background:var(--green);width:0;transition:width .2s}.pillbar{display:flex;gap:7px;flex-wrap:wrap}.table{width:100%;border-collapse:collapse}.table th,.table td{text-align:left;padding:12px;border-bottom:1px solid var(--line)}.table th{color:var(--muted);font-size:12px}.authwrap{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:min(430px,100%);border:1px solid var(--line);background:var(--panel);padding:30px;border-radius:20px}.toast{position:fixed;bottom:20px;right:20px;background:var(--green);color:#102016;padding:12px 16px;border-radius:12px;font-weight:700;box-shadow:0 10px 40px #0008;z-index:5}.mobilemenu{display:none}
@media(max-width:800px){.shell{grid-template-columns:1fr}.side{display:none}.side.open{display:flex;position:fixed;z-index:10;inset:0 auto 0 0;width:260px;box-shadow:0 0 0 100vmax #0008}.mobilemenu{display:inline-block}.top{padding:0 15px}.content{padding:20px 14px}.stats{grid-template-columns:repeat(2,minmax(0,1fr))}.lessons{grid-template-columns:repeat(3,minmax(0,1fr))}.heading{font-size:29px}}
</style>
</head><body>
<div id="root"><div class="authwrap"><div class="authbox"><div class="brand"><div class="logo">A</div>Axiom</div><p class="muted">Loading your study workspace…</p></div></div></div>
<script src="./src/config.js"></script>
<script type="module" src="./src/main.js"></script>
</body></html>
